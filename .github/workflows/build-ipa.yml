name: Build Outpost IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile Outpost
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          rm -rf build
          mkdir -p build/Payload/Outpost.app
          APP="build/Payload/Outpost.app"
          xcrun swiftc -parse-as-library -target arm64-apple-ios15.0 -sdk "$SDK" -O \
            -framework Foundation -framework SwiftUI -framework UIKit \
            Sources/*.swift -o "$APP/Outpost"
          chmod +x "$APP/Outpost"
          cp Info.plist "$APP/Info.plist"
      - name: Package unsigned IPA
        shell: bash
        run: cd build && zip -qry Outpost-unsigned.ipa Payload && test -f Outpost-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Outpost-unsigned-ipa
          path: build/Outpost-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
